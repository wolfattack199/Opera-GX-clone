<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free search</title>

    <link rel="icon" href="Loxy.jpg" type="image/png">

    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --gx-red: #fa1e4e;
            --gx-dark-red: #8c102b;
            --bg-main: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-accent: #252525;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --border-color: #333333;
            --vpn-on: #00ff88;
            --vpn-stealth: #00d4ff;
            --vpn-secure: #ffaa00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Tab Bar --- */
        .tab-bar {
            background-color: var(--bg-main);
            display: flex;
            align-items: flex-end;
            padding: 8px 8px 0 8px;
            gap: 4px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab {
            background-color: var(--bg-secondary);
            padding: 8px 16px;
            border-radius: 8px 8px 0 0;
            min-width: 120px;
            max-width: 200px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            font-size: 13px;
            border: 1px solid transparent;
            border-bottom: none;
            transition: background 0.2s;
            position: relative;
        }

        .tab.active {
            background-color: var(--bg-accent);
            border-color: var(--border-color);
            border-top: 2px solid var(--gx-red);
        }

        .tab:hover:not(.active) {
            background-color: var(--bg-accent);
        }

        .tab-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 8px;
        }

        .close-tab {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            opacity: 0.6;
        }

        .close-tab:hover {
            background-color: var(--gx-red);
            opacity: 1;
        }

        .add-tab {
            padding: 8px;
            cursor: pointer;
            color: var(--text-dim);
            display: flex;
            align-items: center;
        }

        .add-tab:hover {
            color: var(--text-main);
        }

        /* --- Toolbar --- */
        .toolbar {
            background-color: var(--bg-accent);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
        }

        .nav-btn:hover {
            background-color: rgba(255,255,255,0.1);
            color: var(--text-main);
        }

        .address-bar-container {
            flex-grow: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .address-bar {
            width: 100%;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 16px 6px 36px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .address-bar:focus {
            border-color: var(--gx-red);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            color: var(--text-dim);
        }

        .vpn-badge {
            position: absolute;
            right: 12px;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: var(--border-color);
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.3s;
        }

        .vpn-badge.active {
            background-color: var(--vpn-on);
            color: #000;
            box-shadow: 0 0 10px var(--vpn-on);
        }
        
        .vpn-badge.stealth {
            background-color: var(--vpn-stealth);
            color: #000;
            box-shadow: 0 0 10px var(--vpn-stealth);
        }
        
        .vpn-badge.secure {
            background-color: var(--vpn-secure);
            color: #000;
            box-shadow: 0 0 10px var(--vpn-secure);
        }

        .settings-btn {
            color: var(--text-dim);
            cursor: pointer;
        }

        .settings-btn:hover {
            color: var(--gx-red);
        }

        /* --- Browser Content --- */
        .browser-content {
            flex-grow: 1;
            position: relative;
            background-color: #fff;
        }

        .tab-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            border: none;
        }

        .tab-view.active {
            display: block;
        }

        /* --- Home Screen --- */
        .home-screen {
            background-color: var(--bg-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .home-logo {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(45deg, var(--gx-red), #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .home-search {
            width: 500px;
            max-width: 90%;
            position: relative;
        }

        /* --- Loading Spinner --- */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 15, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(250, 30, 78, 0.1);
            border-left-color: var(--gx-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* --- Settings Panel --- */
        .settings-overlay {
            position: fixed;
            top: 0;
            right: -320px;
            width: 320px;
            height: 100%;
            background-color: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            z-index: 1000;
            transition: right 0.3s ease;
            padding: 20px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            overflow-y: auto;
        }

        .settings-overlay.open {
            right: 0;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .setting-section {
            margin-bottom: 25px;
        }

        .setting-section h3 {
            font-size: 14px;
            color: var(--gx-red);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .vpn-mode-selector {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .mode-btn {
            background: var(--bg-accent);
            border: 1px solid var(--border-color);
            color: var(--text-dim);
            padding: 6px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            border-color: var(--gx-red);
            color: var(--text-main);
            background: rgba(250, 30, 78, 0.1);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #444;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--gx-red);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* --- Star Background --- */
        #background-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #1a0a0a 0%, #000000 100%);
        }
    </style>
</head>
<body>
    <canvas id="background-canvas"></canvas>

    <div class="tab-bar" id="tab-bar">
        <div class="add-tab" id="add-tab-btn">
            <i data-lucide="plus" size="18"></i>
        </div>
    </div>

    <div class="toolbar">
        <div class="nav-buttons">
            <button class="nav-btn" id="back-btn"><i data-lucide="arrow-left" size="18"></i></button>
            <button class="nav-btn" id="forward-btn"><i data-lucide="arrow-right" size="18"></i></button>
            <button class="nav-btn" id="refresh-btn"><i data-lucide="rotate-cw" size="18"></i></button>
            <button class="nav-btn" id="home-btn"><i data-lucide="home" size="18"></i></button>
        </div>

        <div class="address-bar-container">
            <i data-lucide="search" size="14" class="search-icon"></i>
            <input type="text" class="address-bar" id="address-input" placeholder="Search or enter address">
            <div class="vpn-badge" id="vpn-badge">VPN</div>
        </div>

        <div class="nav-buttons">
            <i data-lucide="settings" size="20" class="settings-btn" id="settings-toggle"></i>
        </div>
    </div>

    <div class="browser-content" id="browser-content">
        <!-- Tabs will be injected here -->
    </div>

    <div class="settings-overlay" id="settings-panel">
        <div class="settings-header">
            <h2>Settings</h2>
            <i data-lucide="x" size="24" style="cursor:pointer" id="close-settings"></i>
        </div>

        <div class="setting-section">
            <h3>VPN Configuration</h3>
            <div class="setting-item">
                <span>Enable VPN</span>
                <label class="switch">
                    <input type="checkbox" id="vpn-toggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 10px;">VPN Mode:</div>
            <div class="vpn-mode-selector">
                <button class="mode-btn active" data-mode="standard">Standard</button>
                <button class="mode-btn" data-mode="stealth">Stealth</button>
                <button class="mode-btn" data-mode="secure">Secure</button>
            </div>
        </div>

        <div class="setting-section">
            <h3>Privacy & Security</h3>
            <div class="setting-item">
                <span>Save Sessions Locally</span>
                <label class="switch">
                    <input type="checkbox" id="save-sessions" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>Block Trackers</span>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <button id="clear-data" style="width:100%; padding:10px; background:var(--bg-accent); border:1px solid var(--border-color); color:var(--gx-red); border-radius:4px; cursor:pointer; margin-top:10px;">Clear Local Data</button>
        </div>

        <div class="setting-section">
            <h3>Appearance</h3>
            <div class="setting-item">
                <span>Animated Background</span>
                <label class="switch">
                    <input type="checkbox" id="bg-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // --- State Management ---
        let tabs = [];
        let activeTabId = null;
        let vpnEnabled = false;
        let vpnMode = 'standard';
        const proxyAPI = 'https://api.codetabs.com/v1/proxy?quest=';

        // --- DOM Elements ---
        const tabBar = document.getElementById('tab-bar');
        const addTabBtn = document.getElementById('add-tab-btn');
        const addressInput = document.getElementById('address-input');
        const browserContent = document.getElementById('browser-content');
        const vpnToggle = document.getElementById('vpn-toggle');
        const vpnBadge = document.getElementById('vpn-badge');
        const settingsToggle = document.getElementById('settings-toggle');
        const settingsPanel = document.getElementById('settings-panel');
        const closeSettings = document.getElementById('close-settings');
        const saveSessionsToggle = document.getElementById('save-sessions');

        // --- Tab Management ---
        function createTab(url = '') {
            const id = Math.random().toString(36).substr(2, 9);
            const newTab = {
                id: id,
                title: 'New Tab',
                url: url,
                history: [],
                historyIndex: -1
            };
            tabs.push(newTab);
            
            const view = document.createElement('div');
            view.id = `view-${id}`;
            view.className = 'tab-view';
            browserContent.appendChild(view);

            if (url) {
                loadUrlInTab(id, url);
            } else {
                renderHomeScreen(id);
            }

            renderTabs();
            switchTab(id);
        }

        function renderTabs() {
            const existingTabs = tabBar.querySelectorAll('.tab');
            existingTabs.forEach(t => t.remove());

            tabs.forEach(tab => {
                const tabEl = document.createElement('div');
                tabEl.className = `tab ${tab.id === activeTabId ? 'active' : ''}`;
                tabEl.onclick = () => switchTab(tab.id);
                
                tabEl.innerHTML = `
                    <span class="tab-title">${tab.title}</span>
                    <div class="close-tab" onclick="event.stopPropagation(); closeTab('${tab.id}')">
                        <i data-lucide="x" size="12"></i>
                    </div>
                `;
                tabBar.insertBefore(tabEl, addTabBtn);
            });
            lucide.createIcons();
        }

        function renderHomeScreen(id) {
            const container = document.getElementById(`view-${id}`);
            container.innerHTML = `
                <div class="home-screen">
                    <div class="home-logo">OperaGX</div>
                    <div class="home-search">
                        <input type="text" class="address-bar" style="padding-left: 20px;" 
                               placeholder="Enter URL to browse securely..." 
                               onkeypress="if(event.key === 'Enter') loadUrlInTab('${id}', this.value)">
                    </div>
                    <div style="margin-top: 20px; color: var(--text-dim); font-size: 14px;">
                        Fast • Secure • Unblocked
                    </div>
                </div>
            `;
        }

        function loadUrlInTab(id, url) {
            const container = document.getElementById(`view-${id}`);
            const tab = tabs.find(t => t.id === id);
            if (!tab) return;

            url = normalizeUrl(url);
            tab.url = url;
            if (id === activeTabId) addressInput.value = url;

            // Show loading state
            container.innerHTML = `
                <div class="loading-overlay">
                    <div class="spinner"></div>
                    <div style="color: var(--gx-red); font-weight: bold;">BYEBLOCKER PROXY</div>
                    <div style="font-size: 12px; color: var(--text-dim); margin-top: 5px;">Fetching ${url}...</div>
                </div>
            `;

            // Fix for "Refused to connect" and white screens:
            // We use a more robust proxy fetching and injection method.
            fetch(proxyAPI + encodeURIComponent(url))
                .then(response => {
                    if (!response.ok) throw new Error('Proxy error');
                    return response.text();
                })
                .then(html => {
                    container.innerHTML = '';
                    const iframe = document.createElement('iframe');
                    iframe.style.width = '100%';
                    iframe.style.height = '100%';
                    iframe.style.border = 'none';
                    iframe.style.backgroundColor = '#fff';
                    container.appendChild(iframe);

                    // Intercept navigation inside iframe
                    const baseTag = `<base href="${url}">`;
                    
                    // Enhanced script to handle internal navigation and session saving
                    const injectionScript = `
                        <script>
                            // Intercept all link clicks
                            document.addEventListener('click', function(e) {
                                const link = e.target.closest('a');
                                if (link && link.href && !link.href.startsWith('javascript:')) {
                                    e.preventDefault();
                                    window.parent.postMessage({type: 'nav', url: link.href, tabId: '${id}'}, '*');
                                }
                            }, true);

                            // Intercept form submissions (Logins)
                            document.addEventListener('submit', function(e) {
                                const form = e.target;
                                e.preventDefault();
                                const formData = new FormData(form);
                                const data = {};
                                formData.forEach((value, key) => data[key] = value);
                                
                                // Save session data locally if enabled
                                if (window.parent.saveSessionsEnabled) {
                                    const domain = new URL('${url}').hostname;
                                    const savedData = JSON.parse(localStorage.getItem('bb_sessions') || '{}');
                                    savedData[domain] = data;
                                    localStorage.setItem('bb_sessions', JSON.stringify(savedData));
                                }

                                // Handle form submission through proxy
                                const action = new URL(form.action || '${url}', '${url}').href;
                                window.parent.postMessage({type: 'nav', url: action, tabId: '${id}'}, '*');
                            }, true);
                        <\/script>
                    `;

                    const fixedHtml = html.replace('<head>', `<head>${baseTag}${injectionScript}`);
                    
                    // Use blob to avoid some iframe restrictions
                    const blob = new Blob([fixedHtml], {type: 'text/html'});
                    iframe.src = URL.createObjectURL(blob);

                    updateTabTitle(id, url);
                })
                .catch(err => {
                    container.innerHTML = `
                        <div class="home-screen">
                            <div style="color: var(--gx-red); font-size: 24px; margin-bottom: 10px;">Connection Refused</div>
                            <div style="color: var(--text-dim); margin-bottom: 20px;">The site ${url} refused to connect or is blocked.</div>
                            <button class="nav-btn" style="background: var(--gx-red); color: white; padding: 8px 20px; border-radius: 4px;" onclick="renderHomeScreen('${id}')">Go Back</button>
                        </div>
                    `;
                });
        }

        // Handle messages from iframes
        window.addEventListener('message', function(e) {
            if (e.data.type === 'nav') {
                loadUrlInTab(e.data.tabId, e.data.url);
            }
        });

        window.saveSessionsEnabled = true;

        function switchTab(id) {
            activeTabId = id;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
            
            const activeTab = tabs.find(t => t.id === id);
            if (activeTab) {
                renderTabs();
                const viewEl = document.getElementById(`view-${id}`);
                if (viewEl) viewEl.classList.add('active');
                addressInput.value = activeTab.url;
            }
        }

        function closeTab(id) {
            const index = tabs.findIndex(t => t.id === id);
            if (index === -1) return;

            tabs.splice(index, 1);
            const view = document.getElementById(`view-${id}`);
            if (view) view.remove();

            if (tabs.length === 0) {
                createTab();
            } else if (activeTabId === id) {
                switchTab(tabs[Math.max(0, index - 1)].id);
            } else {
                renderTabs();
            }
        }

        function updateTabTitle(id, url) {
            const tab = tabs.find(t => t.id === id);
            if (tab) {
                try {
                    const domain = new URL(normalizeUrl(url)).hostname;
                    tab.title = domain;
                } catch(e) {
                    tab.title = url;
                }
                renderTabs();
            }
        }

        function normalizeUrl(url) {
            if (!url) return '';
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                if (url.includes('.') && !url.includes(' ')) return 'https://' + url;
                return 'https://www.google.com/search?q=' + encodeURIComponent(url);
            }
            return url;
        }

        // --- Event Listeners ---
        addTabBtn.onclick = () => createTab();

        addressInput.onkeypress = (e) => {
            if (e.key === 'Enter') {
                loadUrlInTab(activeTabId, addressInput.value);
            }
        };

        vpnToggle.onchange = (e) => {
            vpnEnabled = e.target.checked;
            updateVPNBadge();
        };

        function updateVPNBadge() {
            vpnBadge.className = 'vpn-badge';
            if (vpnEnabled) {
                vpnBadge.classList.add('active');
                if (vpnMode === 'stealth') vpnBadge.classList.add('stealth');
                if (vpnMode === 'secure') vpnBadge.classList.add('secure');
                vpnBadge.innerText = `VPN ${vpnMode.toUpperCase()}`;
            } else {
                vpnBadge.innerText = 'VPN';
            }
        }

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                vpnMode = btn.dataset.mode;
                updateVPNBadge();
            };
        });

        settingsToggle.onclick = () => settingsPanel.classList.add('open');
        closeSettings.onclick = () => settingsPanel.classList.remove('open');
        saveSessionsToggle.onchange = (e) => window.saveSessionsEnabled = e.target.checked;
        
        document.getElementById('clear-data').onclick = () => {
            localStorage.removeItem('bb_sessions');
            alert('Local session data cleared.');
        };

        document.getElementById('home-btn').onclick = () => renderHomeScreen(activeTabId);
        document.getElementById('refresh-btn').onclick = () => {
            const tab = tabs.find(t => t.id === activeTabId);
            if (tab && tab.url) loadUrlInTab(activeTabId, tab.url);
        };

        // --- Background Animation ---
        const canvas = document.getElementById('background-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let bgEnabled = true;

        document.getElementById('bg-toggle').onchange = (e) => bgEnabled = e.target.checked;

        function initStars() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < 200; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2,
                    speed: Math.random() * 0.5,
                    opacity: Math.random()
                });
            }
        }

        function animate() {
            if (bgEnabled) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                stars.forEach(star => {
                    ctx.fillStyle = `rgba(250, 30, 78, ${star.opacity})`;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fill();
                    star.y -= star.speed;
                    if (star.y < 0) star.y = canvas.height;
                });
            }
            requestAnimationFrame(animate);
        }

        window.onresize = initStars;
        initStars();
        animate();

        createTab();
    </script>
</body>
</html>
